<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Try-On Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .result-image {
            max-width: 100%;
            max-height: 80vh;
            display: block;
            margin: 0 auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .container {
            max-width: 900px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Virtual Try-On Result</h1>
        
        <div class="text-center mb-4">
            <img src="{{ url_for('static', filename=result_image) }}" alt="Try-On Result" class="result-image">
        </div>
        
        <div class="d-grid gap-2 col-6 mx-auto">
            <a href="{{ url_for('index') }}" class="btn btn-primary">Try Again</a>
            <a href="{{ url_for('static', filename=result_image) }}" class="btn btn-secondary" download>Download Image</a>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
